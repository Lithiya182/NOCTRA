version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - backend

  public-app:
    build:
      context: ./public-app
    ports:
      - "5174:5174"
    depends_on:
      - backend